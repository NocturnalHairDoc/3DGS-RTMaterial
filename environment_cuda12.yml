# 适配 CUDA 12.x（如 12.6 / 12.8 / 12.9）的环境
# 安装步骤见 README「适配 CUDA 12」小节，或直接运行: bash install_cuda12.sh
name: gaussian_splatting
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - plyfile=0.8.1
  - tqdm
  - hdbscan
  - matplotlib
  - pip:
    - dearpygui
    - opencv-python
    - open-clip-torch
    - joblib==1.1.0
