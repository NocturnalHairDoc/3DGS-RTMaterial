name: tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install numpy torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p "test_core.py" -v
